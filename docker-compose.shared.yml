# Shared API overlay. Run with:
#   docker compose --env-file .env.shared -f docker-compose.yml -f docker-compose.shared.yml up --build api
# Supply structured API_AUTH_TOKENS through the deployment secret manager.
services:
  api:
    env_file: !override
      - .env.shared
    environment:
      APP_ENV: production
      API_AUTH_REQUIRED: "true"
      API_AUTH_TOKEN: ""
      API_AUTH_TOKENS: "${API_AUTH_TOKENS:?Set structured API_AUTH_TOKENS JSON through the deployment secret manager}"
      API_DEFAULT_TENANT_ID: "${API_DEFAULT_TENANT_ID:?Set a canonical lowercase default tenant ID}"
      API_AUDIT_ENABLED: "true"
      TENANT_STORAGE_ISOLATION: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped
