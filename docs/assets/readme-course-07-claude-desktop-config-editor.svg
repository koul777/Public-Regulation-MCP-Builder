<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Desktop 로컬 MCP Config 편집 화면 예시</title>
  <desc id="desc">Settings, Developer, Local MCP servers, Edit Config 순서와 기존 설정을 보존하며 직접 Python MCP 서버 항목을 병합하는 과정을 표시한 개인정보 없는 안내 화면입니다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity=".14"/></filter>
    <style>
      text { font-family: "Malgun Gothic", "Segoe UI", sans-serif; }
      .body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}
      .mono{font-family:Consolas,monospace;font-size:16px}.step{font-size:20px;font-weight:800;fill:white;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f1f3f6"/>
  <rect x="45" y="40" width="1510" height="820" rx="24" fill="white" filter="url(#shadow)"/>
  <rect x="45" y="40" width="1510" height="76" rx="24" fill="#312e2b"/>
  <text x="85" y="88" font-size="28" font-weight="800" fill="#fff7ed">Claude Desktop · 로컬 STDIO 설정</text>
  <text x="1340" y="86" class="small" fill="#e7e5e4">설명용 화면 · 개인정보 없음</text>

  <rect x="45" y="116" width="520" height="744" fill="#faf7f2"/>
  <text x="85" y="170" font-size="27" font-weight="800">Settings</text>
  <circle cx="92" cy="230" r="21" fill="#d97706"/><text x="92" y="231" class="step">1</text>
  <rect x="125" y="200" width="400" height="60" rx="12" fill="#ffedd5"/>
  <text x="150" y="239" class="label" fill="#9a3412">Developer / 개발자</text>
  <circle cx="92" cy="312" r="21" fill="#d97706"/><text x="92" y="313" class="step">2</text>
  <rect x="125" y="282" width="400" height="60" rx="12" fill="#fff"/>
  <text x="150" y="321" class="label">Local MCP servers</text>
  <circle cx="92" cy="394" r="21" fill="#d97706"/><text x="92" y="395" class="step">3</text>
  <rect x="125" y="364" width="400" height="60" rx="12" fill="#312e2b"/>
  <text x="325" y="403" class="label" fill="white" text-anchor="middle">Edit Config / 구성 편집</text>

  <rect x="80" y="475" width="445" height="165" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="105" y="510" class="label" fill="#9a3412">여기서는 URL을 넣지 않습니다.</text>
  <text x="105" y="545" class="body" fill="#9a3412">생성된 command · args · env가</text>
  <text x="105" y="578" class="body" fill="#9a3412">있는 JSON을 병합합니다.</text>
  <text x="105" y="615" class="small" fill="#9a3412">일반 Connectors 메뉴와 다른 화면입니다.</text>

  <text x="610" y="160" font-size="26" font-weight="800">claude_desktop_config.json — 메모장</text>
  <rect x="600" y="185" width="905" height="565" rx="12" fill="#0f172a"/>
  <text x="625" y="220" class="mono" fill="#cbd5e1">{</text>
  <text x="650" y="249" class="mono" fill="#cbd5e1">"preferences": { "theme": "dark" },</text>
  <text x="650" y="278" class="mono" fill="#cbd5e1">"mcpServers": {</text>
  <text x="675" y="307" class="mono" fill="#94a3b8">"기존-서버": { "command": "기존 값" },</text>
  <text x="675" y="336" class="mono" fill="#fde68a">"기관-규정": {</text>
  <text x="700" y="365" class="mono" fill="#93c5fd">"command": "C:\\project\\.venv\\Scripts\\python.exe",</text>
  <text x="700" y="394" class="mono" fill="#cbd5e1">"args": [</text>
  <text x="725" y="423" class="mono" fill="#c4b5fd">"-m", "scripts.run_regulation_mcp",</text>
  <text x="725" y="452" class="mono" fill="#c4b5fd">"--data-dir", "C:\\MCP 번들\\기관 규정\\data",</text>
  <text x="725" y="481" class="mono" fill="#c4b5fd">"--tenant-id", "생성된 값", "--transport", "stdio",</text>
  <text x="725" y="510" class="mono" fill="#c4b5fd">"--profile-id", "생성된 값", "--flat-storage",</text>
  <text x="725" y="539" class="mono" fill="#c4b5fd">"--tool-profile", "생성된 값", "--no-warm-cache"</text>
  <text x="700" y="568" class="mono" fill="#cbd5e1">],</text>
  <text x="700" y="597" class="mono" fill="#cbd5e1">"env": {</text>
  <text x="725" y="626" class="mono" fill="#86efac">"PYTHONPATH": "C:\\project",</text>
  <text x="725" y="655" class="mono" fill="#86efac">"PYTHONSAFEPATH": "1"</text>
  <text x="700" y="684" class="mono" fill="#cbd5e1">}</text>
  <text x="675" y="713" class="mono" fill="#fde68a">}</text>
  <text x="650" y="742" class="mono" fill="#cbd5e1">}}</text>

  <circle cx="630" cy="798" r="22" fill="#d97706"/><text x="630" y="799" class="step">4</text>
  <text x="667" y="806" class="label">Ctrl+S → Claude 완전 종료 → 다시 실행</text>
  <rect x="1110" y="775" width="395" height="55" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1135" y="809" class="small" fill="#047857">running 확인 · 기존 설정 삭제 금지</text>
</svg>
