<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Desktop MCP 연결 3단계: 재시작과 검색 검증</title>
  <desc id="desc">Claude Desktop을 완전히 종료하고 재실행한 뒤 서버 running 상태, search 검색 결과, fetch 원문 반환을 순서대로 확인하는 그림</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#f2ede7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4d3727" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#8b5e3c"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="80" y="85" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="49" font-weight="700" fill="#523b2b">3. 완전히 재시작하고 search → fetch 확인</text>
  <text x="80" y="138" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="24" fill="#766256">서버 이름만 보이면 끝이 아닙니다. 원문 반환까지 확인합니다.</text>

  <g filter="url(#shadow3)">
    <rect x="75" y="220" width="405" height="500" rx="26" fill="#ffffff"/>
    <circle cx="278" cy="345" r="92" fill="#f8e7df"/>
    <path d="M278 285 v70" stroke="#a35f46" stroke-width="18" stroke-linecap="round"/>
    <path d="M228 327 a70 70 0 1 0 100 0" fill="none" stroke="#a35f46" stroke-width="18" stroke-linecap="round"/>
    <text x="278" y="485" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="31" font-weight="700" fill="#523b2b">① 완전 종료</text>
    <text x="278" y="535" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="23" fill="#766256">작업 표시줄 알림 영역에서</text>
    <text x="278" y="570" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="23" fill="#766256">Claude 아이콘 → 종료</text>
    <rect x="130" y="615" width="296" height="48" rx="12" fill="#f5f0eb"/>
    <text x="278" y="647" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#6b4c38">그 다음 Claude 다시 실행</text>
  </g>

  <path d="M500 455 H570" stroke="#8b5e3c" stroke-width="10" marker-end="url(#arrow)"/>

  <g filter="url(#shadow3)">
    <rect x="600" y="220" width="405" height="500" rx="26" fill="#ffffff"/>
    <rect x="645" y="280" width="315" height="245" rx="18" fill="#f8f5f2" stroke="#cbb6a5" stroke-width="3"/>
    <text x="675" y="327" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#523b2b">파일·커넥터 추가</text>
    <rect x="675" y="365" width="255" height="105" rx="14" fill="#e6f6eb" stroke="#51a66b" stroke-width="3"/>
    <circle cx="710" cy="417" r="12" fill="#3aa65c"/>
    <text x="740" y="410" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#285e38">기관-규정</text>
    <text x="740" y="445" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="21" fill="#3b7a4c">running</text>
    <text x="802" y="575" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="31" font-weight="700" fill="#523b2b">② running 확인</text>
    <text x="802" y="622" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="22" fill="#766256">새 대화에서 서버 활성화</text>
  </g>

  <path d="M1025 455 H1095" stroke="#8b5e3c" stroke-width="10" marker-end="url(#arrow)"/>

  <g filter="url(#shadow3)">
    <rect x="1125" y="220" width="405" height="500" rx="26" fill="#ffffff"/>
    <rect x="1165" y="270" width="325" height="95" rx="18" fill="#f1e8ff"/>
    <text x="1190" y="306" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#5a3d80">search</text>
    <text x="1190" y="339" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="20" fill="#5d5169">“인사규정을 찾아줘”</text>
    <path d="M1327 375 V410" stroke="#8b5e3c" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="1165" y="430" width="325" height="76" rx="18" fill="#fff3d8"/>
    <text x="1327" y="478" text-anchor="middle" font-family="Consolas, Malgun Gothic, monospace" font-size="21" font-weight="700" fill="#745817">검색 결과 id</text>
    <path d="M1327 516 V551" stroke="#8b5e3c" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="1165" y="570" width="325" height="76" rx="18" fill="#e6f6eb"/>
    <text x="1190" y="600" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#285e38">fetch</text>
    <text x="1190" y="630" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="20" fill="#3b7a4c">원문 + 출처 반환 ✓</text>
    <text x="1327" y="700" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="31" font-weight="700" fill="#523b2b">③ 실제 도구 확인</text>
  </g>

  <rect x="150" y="770" width="1300" height="78" rx="20" fill="#ffffff" stroke="#bca28f" stroke-width="3"/>
  <text x="800" y="818" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#523b2b">성공 기준: running + search 결과 + fetch 원문, 세 가지가 모두 보여야 합니다.</text>
</svg>
