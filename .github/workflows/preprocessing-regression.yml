name: Preprocessing regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  regression:
    name: preprocessing-regression
    # The shipped operator path and Kordoc shim/BAT regressions are Windows-specific.
    # Git Bash keeps the readable multiline commands while Python still runs on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and build tooling
        run: python -m pip install --disable-pip-version-check -e . build

      - name: Run beginner service and recovery contracts first
        run: |
          python -m unittest -v \
            tests.test_readiness_adapter \
            tests.test_local_llm_readiness_service \
            tests.test_indexing_readiness_service \
            tests.test_operator_setup_service \
            tests.test_local_app_service \
            tests.test_authoring_service \
            tests.test_authoring_official_isolation \
            tests.test_streamlit_setup \
            tests.test_streamlit_authoring \
            tests.test_streamlit_approval_app \
            tests.test_ai_review_display

      - name: Run parsing and preprocessing regression suite
        run: |
          python -m unittest -v \
            tests.test_preprocessing_change_guard \
            tests.test_github_workflow_templates \
            tests.test_deployment_defaults \
            tests.test_docx_parser \
            tests.test_hwp_parser \
            tests.test_hwpx_parser \
            tests.test_pdf_parser \
            tests.test_office_archive_safety \
            tests.test_normalizer \
            tests.test_metadata_extractor \
            tests.test_structure_detector \
            tests.test_table_extractor \
            tests.test_kordoc_table_matcher \
            tests.test_kordoc_table_parser \
            tests.test_chunker \
            tests.test_vector_ingestion_adapter \
            tests.test_bm25_index \
            tests.test_bm25_structured_metadata \
            tests.test_hierarchical_index \
            tests.test_input_packaging_parity \
            tests.test_quality_gate \
            tests.test_pipeline \
            tests.test_processing_service \
            tests.test_article_validity \
            tests.test_generate_mcp_client_config \
            tests.test_run_mcp_client_config_smoke \
            tests.test_run_mcp_transport_smoke \
            tests.test_run_regulation_mcp \
            tests.test_check_mcp_connection_readiness \
            tests.test_beginner_workflow_services \
            tests.test_local_llm_doctor \
            tests.test_qwen_chat_app \
            tests.test_streamlit_ai_usage_path \
            tests.test_streamlit_operator_mode \
            tests.test_streamlit_approval_helpers \
            tests.test_hidden_process \
            tests.test_local_http \
            tests.test_ollama_runtime

      - name: Run tenant isolation, API security, approval and repository contracts
        run: |
          python -m unittest -v \
            tests.test_api_security \
            tests.test_api_tenant_isolation \
            tests.test_tenant_access \
            tests.test_repository \
            tests.test_repository_journal_integrity \
            tests.test_approval_governance \
            tests.test_approval_governance_invariants \
            tests.test_retrieval_security \
            tests.test_official_rag_approval_gate_policy

      # Largest API route and MCP tool suites. This step is separate so it can be
      # dropped on its own if pull request runtime becomes a concern; the same
      # modules still run after merge in the auto-release verify job.
      - name: Run large API route and MCP tool suites
        run: |
          python -m unittest -v \
            tests.test_routes_rag \
            tests.test_routes_documents \
            tests.test_regulation_mcp_tools

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel

      - name: Audit public source hygiene
        run: >-
          python scripts/audit_release_hygiene.py
          --workflow-scope available
          --include-untracked
          --include-source-path-scan
