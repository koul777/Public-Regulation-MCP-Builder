name: Auto release on main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  verify:
    # Read-only job: tests, dependency installs, and public gates never receive a write token.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip auto-release]')
    # The project and its regression fixtures exercise Windows paths and shims.
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.verified.outputs.sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Record the verified commit
        id: verified
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and build dependencies
        run: python -m pip install ".[dev]"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Audit public source hygiene
        run: python scripts/audit_release_hygiene.py --workflow-scope available --include-untracked --include-source-path-scan

      - name: Run public release gate
        run: python scripts/run_public_release_gate.py --root . --include-untracked --fail-on-blocked

  release:
    needs: verify
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip auto-release]')
    # The project and its regression fixtures exercise Windows paths and shims.
    runs-on: windows-latest
    # Only this job may write to the repository; it runs after every gate in verify has passed.
    permissions:
      contents: write

    steps:
      # Build exactly the commit that verify tested, even if main has moved since.
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and build dependencies
        run: python -m pip install ".[dev]"

      - name: Determine and write the release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/__init__.py")
          contents = path.read_text(encoding="utf-8")
          match = re.search(r'(?m)^__version__ = "(\d+)\.(\d+)\.(\d+)"$', contents)
          if not match:
              raise SystemExit("A semantic project version is required in app/__init__.py.")
          source_version = tuple(int(value) for value in match.groups())
          tags = []
          for tag in os.popen("git tag --list").read().splitlines():
              tag_match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              if tag_match:
                  tags.append((tuple(int(value) for value in tag_match.groups()), tag))
          latest_version, latest_tag = max(tags, default=(None, None))
          head = os.popen("git rev-parse HEAD").read().strip()
          tagged_head = (
              os.popen(f"git rev-list -n 1 {latest_tag}").read().strip()
              if latest_tag
              else ""
          )
          if latest_version is None or source_version > latest_version or (
              source_version == latest_version and head == tagged_head
          ):
              release_version = source_version
          else:
              release_version = (latest_version[0], latest_version[1], latest_version[2] + 1)
              next_version = ".".join(str(value) for value in release_version)
              contents = contents[:match.start()] + f'__version__ = "{next_version}"' + contents[match.end():]
              path.write_text(contents, encoding="utf-8")
          version_text = ".".join(str(value) for value in release_version)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version_text}\n")
              output.write(f"tag=v{version_text}\n")
          PY

      - name: Build release artifacts
        run: python -m build --sdist --wheel

      - name: Build Windows portable ZIP
        shell: powershell
        run: .\scripts\build_windows_portable.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Commit the release version and tag it
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          # The artifacts were built from the commit that verify tested. If main has
          # moved since, stop instead of rebasing: a rebase would tag code that no gate
          # verified. The run for the newer commit releases it.
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${remote_main}" != "${VERIFIED_SHA}" ]; then
            echo "main moved from ${VERIFIED_SHA} to ${remote_main} after verification; not releasing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_commit_created=0
          if ! git diff --quiet -- app/__init__.py; then
            git add app/__init__.py
            git commit -m "chore(release): ${TAG} [skip auto-release]"
            release_commit_created=1
          fi
          if [ "${release_commit_created}" -eq 1 ]; then
            git push origin HEAD:main
          fi
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null \
            && ! git ls-remote --exit-code --tags origin "${TAG}" > /dev/null 2>&1; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          else
            echo "Tag ${TAG} already exists on origin; skipping tag publish."
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifacts=(
            "dist/reg_rag_preprocessor-${VERSION}-py3-none-any.whl"
            "dist/reg_rag_preprocessor-${VERSION}.tar.gz"
            "dist/PR-MCP-Builder-Windows-x64-${VERSION}.zip"
          )
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact" || { echo "Missing release artifact: $artifact"; exit 1; }
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$TAG" "${artifacts[@]}" --title "$TAG" --generate-notes
          fi
